plugins {
    id 'net.fabricmc.fabric-loom-remap' version '1.17.21'
}

group = project.maven_group
version = "${project.mod_version}+mc${project.minecraft_version}"
base { archivesName = project.archives_base_name }

repositories { mavenCentral() }

dependencies {
    minecraft "com.mojang:minecraft:${project.minecraft_version}"
    mappings loom.officialMojangMappings()
    modImplementation "net.fabricmc:fabric-loader:${project.loader_version}"
    modImplementation "net.fabricmc.fabric-api:fabric-api:${project.fabric_api_version}"
}

java {
    // Use the JDK running Gradle (21 or newer), targeting the Java 21 game runtime.
    sourceCompatibility = JavaVersion.VERSION_21
    targetCompatibility = JavaVersion.VERSION_21
    withSourcesJar()
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
    options.release = 21
}

def resourceProperties = [
    version: project.version,
    minecraft_version: project.minecraft_version,
    loader_version: project.loader_version,
    fabric_api_version: project.fabric_api_version
]

processResources {
    inputs.properties(resourceProperties)
    filesMatching('fabric.mod.json') { expand(resourceProperties) }
}

jar {
    from('LICENSE')
}

// These checks exercise the alarm state machine without starting Minecraft.
// The standalone runner below is used instead of a JUnit test engine.
tasks.named('test') { enabled = false }
tasks.register('logicTest', JavaExec) {
    dependsOn testClasses
    classpath = sourceSets.test.runtimeClasspath
    mainClass = 'dev.zadko.durabilityalarm.core.AlarmLogicTest'
}
check.dependsOn logicTest
